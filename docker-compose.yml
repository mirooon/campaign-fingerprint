# App (viewer + /api/analyze) and a local Ollama.
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull hf.co/mradermacher/PLLuM-12B-instruct-2512-GGUF:Q5_K_M
#   docker compose exec ollama ollama pull bge-m3
#   docker compose up --build app
# On macOS, Ollama in Docker has no Metal GPU: prefer the native Ollama and run only the app:
#   OLLAMA_HOST=http://host.docker.internal:11434 docker compose up --build --no-deps app
# Optional local CT stream (certstream-server-go) for `bun run ct:watch`:
#   docker compose --profile ct up -d certstream
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/mradermacher/PLLuM-12B-instruct-2512-GGUF:Q5_K_M}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANALYZE_OFFLINE: ${ANALYZE_OFFLINE:-1}
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # Local Certificate Transparency stream for `bun run ct:watch` (early-warning demo, opt-in):
  #   docker compose --profile ct up -d certstream
  certstream:
    image: 0rickyy0/certstream-server-go:v1.10.1
    profiles: ["ct"]
    ports:
      - "127.0.0.1:8181:8080"
    volumes:
      - ./docker/certstream/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped

volumes:
  ollama: {}
